<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者控制中心 - 法樞中心</title>
    <link rel="icon" type="image/png" href="admin_favicon.png">
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/db.js"></script>
    <script src="js/supabase.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="css/admin.css">
</head>

</head>

<body>
    <div class="sidebar">
        <h2 style="display: flex; align-items: center; justify-content: center; gap: 10px;">
            <i data-lucide="shield-check" style="width: 24px; height: 24px;"></i> 法樞中心
        </h2>
        <button class="nav-btn active" onclick="showTab('system')" style="display: flex; align-items: center; gap: 10px;">
            <i data-lucide="settings"></i> 系統設定
        </button>
        <button class="nav-btn" onclick="showTab('rooms')" style="display: flex; align-items: center; gap: 10px;">
            <i data-lucide="globe"></i> 房間管理
        </button>
        <button class="nav-btn" onclick="showTab('personnel')" style="display: flex; align-items: center; gap: 10px;">
            <i data-lucide="users"></i> 名單管理
        </button>
        <button class="nav-btn" onclick="showTab('history')" style="display: flex; align-items: center; gap: 10px;">
            <i data-lucide="history"></i> 登入紀錄
        </button>

        <button class="nav-btn logout-btn" onclick="logoutAdmin()" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
            <i data-lucide="log-out"></i> 登出
        </button>
    </div>


    <div class="main-content">
        <header>
            <h1 id="tabTitle">系統設定</h1>
            <div>
                <span id="adminUserDisplay"
                    style="margin-right: 15px; font-weight: bold; color: var(--primary); font-size: 14px; background: rgba(0,0,0,0.05); padding: 5px 12px; border-radius: 20px; display: inline-flex; align-items: center; gap: 6px;">
                    <i data-lucide="user" style="width: 14px; height: 14px;"></i> 讀取中...
                </span>
                <span id="syncStatus" style="display: inline-flex; align-items: center; gap: 6px;">
                    <i data-lucide="refresh-cw" style="width: 14px; height: 14px;"></i> 雲端同步中...
                </span>
            </div>

        </header>

        <!-- 系統設定 -->
        <div id="tab-system" class="card active">
            <div class="card-header">版本號管理</div>
            <div class="form-group">
                <label>當前顯示版本 (同步至全域)：</label>
                <input type="text" id="versionInput" placeholder="例如: 26.04.5 Beta">
            </div>
            <div style="text-align: right;">
                <button class="btn-action btn-save" onclick="updateVersion()">
                    <i data-lucide="save" style="width: 16px; height: 16px;"></i> 儲存並同步版本號
                </button>
            </div>


            <div class="card-header" style="margin-top: 30px;">使用說明書編輯</div>
            <div class="form-group">
                <label>內容 (支援 HTML，同步至全域)：</label>
                <textarea id="manualInput" style="height: 300px;"></textarea>
            </div>
            <div style="text-align: right;">
                <button class="btn-action btn-save" onclick="updateManual()">
                    <i data-lucide="save" style="width: 16px; height: 16px;"></i> 儲存並同步說明書
                </button>
            </div>

            <div class="card-header" style="margin-top: 30px;">
                <span style="display:flex; align-items:center; gap:8px;">
                    <i data-lucide="sparkles" style="width:18px; height:18px; color:#7c3aed;"></i> 近期更新編輯
                </span>
            </div>
            <div class="form-group">
                <label>內容 (支援 HTML，同步至全域)：</label>
                <textarea id="updatesInput" style="height: 200px;" placeholder="例如: &lt;h3&gt;版本 v26.04&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;新增鎖定功能&lt;/li&gt;&lt;/ul&gt;"></textarea>
            </div>
            <div style="text-align: right;">
                <button class="btn-action btn-save" onclick="updateUpdates()">
                    <i data-lucide="save" style="width: 16px; height: 16px;"></i> 儲存並同步近期更新
                </button>
            </div>

        </div>

        <!-- 房間管理 -->
        <div id="tab-rooms" class="card">
            <div class="card-header">
                雲端實體房間維護
                <button class="btn-action btn-refresh" onclick="fetchCloudRooms()"
                    style="padding: 5px 10px; font-size: 12px; display: flex; align-items: center; gap: 6px;">
                    <i data-lucide="refresh-cw" style="width: 14px; height: 14px;"></i> 重新整理
                </button>
            </div>

            <div class="table-container">
                <table id="roomTable">
                    <thead>
                        <tr>
                            <th>房間 ID / 名稱</th>
                            <th>同步狀態</th>
                            <th>建立時間</th>
                            <th style="width: 80px;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="cloudRoomTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- 名單管理 -->
        <div id="tab-personnel" class="card">
            <div class="card-header">跨房間名單維護</div>
            <div class="search-area">
                <div class="form-group">
                    <label>選擇查詢房間：</label>
                    <select id="personnelRoomSelector" onchange="fetchPersonnel()">
                        <option value="">-- 請選擇一個房間 --</option>
                    </select>
                </div>
                <div style="text-align: right;">
                    <button class="btn-action btn-refresh" onclick="fetchPersonnel()" style="display: inline-flex; align-items: center; gap: 6px;">
                        <i data-lucide="search" style="width: 16px; height: 16px;"></i> 重新查詢
                    </button>
                </div>

            </div>

            <div class="table-container">
                <table id="personnelTable">
                    <thead>
                        <tr>
                            <th>姓名</th>
                            <th>性別</th>
                            <th>所屬房間</th>
                            <th style="width: 150px;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="personnelTableBody">
                        <tr>
                            <td colspan="3" style="text-align: center; color: #999; padding: 40px;">請先選擇房間以顯示名單</td>
                        </tr>
                    </tbody>
                </table>
                <div id="personnelLoading" class="loading-spinner" style="display: none;">正在讀取名單...</div>
            </div>
        </div>

        <!-- 登入紀錄 -->
        <div id="tab-history" class="card">
            <div class="card-header">
                系統登入歷史紀錄
                <button class="btn-action btn-refresh" onclick="fetchLoginHistory()"
                    style="padding: 5px 10px; font-size: 12px; display: flex; align-items: center; gap: 6px;">
                    <i data-lucide="refresh-cw" style="width: 14px; height: 14px;"></i> 重新整理
                </button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 60px;">序號</th>
                            <th>登入帳號</th>
                            <th>時間</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <tr>
                            <td colspan="3" style="text-align: center; color: #999; padding: 40px;">正在讀取紀錄...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 閒置警告 Modal -->
    <div id="idle-modal">
        <div class="idle-content">
            <h3 style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                <i data-lucide="alert-triangle"></i> 登出警告
            </h3>
            <p>您已閒置一段時間，系統即將登出...</p>
            <div class="idle-timer-text" id="idle-countdown">30</div>
            <button class="btn-continue" onclick="resetIdleTimerAndHide()">繼續使用</button>
        </div>
    </div>


    <!-- 編輯名單 Modal (簡單實現) -->
    <div id="editModal"
        style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div class="card" style="display: block; width: 400px; margin: 0;">
            <div class="card-header" style="display: flex; align-items: center; gap: 10px;">
                <i data-lucide="edit-3"></i> 編輯人員資料
            </div>

            <div class="form-group">
                <label>姓名：</label>
                <input type="text" id="editPersonName">
            </div>
            <div class="form-group">
                <label>性別：</label>
                <select id="editPersonGender">
                    <option value="male">乾道 (Male)</option>
                    <option value="female">坤道 (Female)</option>
                </select>
            </div>
            <input type="hidden" id="editOldName">
            <input type="hidden" id="editRoomId">
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn-action" onclick="closeEditModal()">取消</button>
                <button class="btn-action btn-save" onclick="commitEdit()" style="display: flex; align-items: center; gap: 6px;">
                    <i data-lucide="save" style="width: 16px; height: 16px;"></i> 確認變更
                </button>
            </div>

        </div>
    </div>

    <script>
        const GLOBAL_ROOM = 'SYSTEM_GLOBAL';
        let roomPresets = [];
        let cloudRooms = [];

        async function initAdmin() {
            // 驗證是否已登入
            const adminEmail = localStorage.getItem('adminEmail');
            if (!adminEmail) {
                alert("請先登入管理員帳號！");
                window.location.href = "admin.html";
                return;
            }

            await window.appDB.init();

            // 顯示當前登入者
            document.getElementById('adminUserDisplay').innerHTML = `<i data-lucide="user" style="width: 14px; height: 14px;"></i> ${adminEmail}`;
            
            // 初始化 Lucide 圖示
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }


            await loadSettings();
            await fetchCloudRooms();
            document.getElementById('syncStatus').innerHTML = '<i data-lucide="check-circle" style="width: 14px; height: 14px; color: #4caf50;"></i> 已連結雲端';
            if (typeof lucide !== 'undefined') lucide.createIcons();


            // 啟動閒置監測
            initIdleMonitor();
        }

        function logoutAdmin() {
            if (confirm("確定要登出管理員模式嗎？")) {
                localStorage.removeItem('adminEmail');
                window.location.href = "admin.html";
            }
        }

        // --- 閒置登出計時邏輯 ---
        let idleTimeout;
        let countdownInterval;
        const IDLE_LIMIT = 90 * 1000; // 90秒後出現提示
        const COUNTDOWN_LIMIT = 30; // 30秒倒數

        function initIdleMonitor() {
            // 監聽各種互動行為
            const events = ['mousemove', 'keydown', 'mousedown', 'touchstart', 'scroll'];
            events.forEach(evt => {
                window.addEventListener(evt, resetIdleTimer, true);
            });
            startIdleTimer();
        }

        function startIdleTimer() {
            clearTimeout(idleTimeout);
            idleTimeout = setTimeout(showIdleModal, IDLE_LIMIT);
        }

        function resetIdleTimer() {
            // 如果警告視窗沒開，就重設計時器
            if (document.getElementById('idle-modal').style.display !== 'flex') {
                startIdleTimer();
            }
        }

        function resetIdleTimerAndHide() {
            document.getElementById('idle-modal').style.display = 'none';
            clearInterval(countdownInterval);
            startIdleTimer();
        }

        function showIdleModal() {
            document.getElementById('idle-modal').style.display = 'flex';
            let remaining = COUNTDOWN_LIMIT;
            document.getElementById('idle-countdown').textContent = remaining;

            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                remaining--;
                document.getElementById('idle-countdown').textContent = remaining;
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    autoLogout();
                }
            }, 1000);
        }

        function autoLogout() {
            localStorage.removeItem('adminEmail');
            alert("您已因閒置過久被自動登出。");
            window.location.href = "admin.html";
        }

        async function loadSettings() {
            const supabase = window.getSupabase();
            let remoteSettings = {};
            if (supabase) {
                try {
                    const { data } = await supabase.from('settings').select('*').eq('room_id', GLOBAL_ROOM);
                    if (data) data.forEach(s => remoteSettings[s.key] = s.value);
                } catch (e) { console.error(e); }
            }
            document.getElementById('versionInput').value = remoteSettings['system_version'] || '26.04.1 Beta';
            document.getElementById('manualInput').value = remoteSettings['user_manual'] || '';
            document.getElementById('updatesInput').value = remoteSettings['recent_updates'] || `<div style="display:flex; align-items:center; gap:10px; margin-bottom:20px; padding:12px 16px; background:linear-gradient(135deg,rgba(124,58,237,0.08),rgba(59,130,246,0.06)); border-radius:12px; border:1px solid rgba(124,58,237,0.15);">
  <span style="font-size:22px;">✨</span>
  <div>
    <div style="font-weight:700; color:#5b21b6; font-size:15px;">版本 v26.04.2 Beta</div>
    <div style="color:#7c3aed; font-size:12px; margin-top:2px;">2026 年 4 月 24 日 更新</div>
  </div>
</div>

<h3 style="display:flex; align-items:center; gap:8px; color:#1e293b; font-size:15px; border-bottom:2px solid #f1f5f9; padding-bottom:8px; margin-top:0;">
  <span style="display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; background:rgba(34,197,94,0.15); border-radius:6px; font-size:13px;">🎨</span>
  介面現代化升級
</h3>
<ul style="padding-left:18px; line-height:2; margin-bottom:20px;">
  <li>全面導入 <strong>Glassmorphism 玻璃態</strong>按鈕風格，採用半透明背景、柔光邊框與毛玻璃效果</li>
  <li>側邊欄按鈕依功能套用色彩語義：紫色＝協作、藍色＝匯出、綠色＝匯入、紅色＝危險操作</li>
  <li>全站圖示系統更換為 <strong>Lucide Line Icons</strong>，線條更輕盈一致</li>
  <li>側邊欄新增品牌標題區與滾動區域，版面結構更清晰</li>
  <li>摺疊區塊改用動態 Chevron 圖示，展開/收合有平滑旋轉動效</li>
</ul>

<h3 style="display:flex; align-items:center; gap:8px; color:#1e293b; font-size:15px; border-bottom:2px solid #f1f5f9; padding-bottom:8px;">
  <span style="display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; background:rgba(59,130,246,0.15); border-radius:6px; font-size:13px;">🔧</span>
  功能修復與優化
</h3>
<ul style="padding-left:18px; line-height:2; margin-bottom:20px;">
  <li>修正<strong>車輛鎖定按鈕</strong>失效問題，鎖定/解鎖功能恢復正常</li>
  <li>修正重新整理後 <strong>Lucide 圖示消失</strong>的問題，動態載入後自動重新初始化</li>
  <li>加入人員輸入框改版為<strong>一體化輸入組合</strong>，乾道/坤道按鈕整合於輸入框右側</li>
  <li>「刪除選取」與「清除所有人員」按鈕可見度大幅提升，加厚邊框並強化對比色</li>
  <li>修正側邊欄展開時內容區位移量與寬度不一致的問題</li>
</ul>

<h3 style="display:flex; align-items:center; gap:8px; color:#1e293b; font-size:15px; border-bottom:2px solid #f1f5f9; padding-bottom:8px;">
  <span style="display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; background:rgba(124,58,237,0.15); border-radius:6px; font-size:13px;">🆕</span>
  新增功能
</h3>
<ul style="padding-left:18px; line-height:2; margin-bottom:20px;">
  <li>新增「<strong>近期更新</strong>」公告入口，管理員可在後台撰寫並同步至全域</li>
  <li>管理後台新增近期更新編輯器，支援 HTML 富文字內容</li>
  <li>管理登入頁套用外部 CSS 與 Lucide 圖示，視覺風格統一</li>
  <li>版本號更新時保留 Copyright 圖示，不再被清空覆蓋</li>
</ul>

<h3 style="display:flex; align-items:center; gap:8px; color:#1e293b; font-size:15px; border-bottom:2px solid #f1f5f9; padding-bottom:8px;">
  <span style="display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; background:rgba(245,158,11,0.15); border-radius:6px; font-size:13px;">⚙️</span>
  程式碼結構優化
</h3>
<ul style="padding-left:18px; line-height:2; margin-bottom:4px;">
  <li>內嵌樣式完整提取至外部 CSS 檔（<code style="background:#f1f5f9; padding:1px 6px; border-radius:4px; font-size:13px;">index.css</code>、<code style="background:#f1f5f9; padding:1px 6px; border-radius:4px; font-size:13px;">admin.css</code>）</li>
  <li>初始化改用 <code style="background:#f1f5f9; padding:1px 6px; border-radius:4px; font-size:13px;">window.addEventListener('load')</code>，避免 onload 衝突</li>
  <li>鎖定狀態切換後自動同步至 Supabase 房間</li>
</ul>`;

        }

        function showTab(tab) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            const btn = Array.from(document.querySelectorAll('.nav-btn')).find(b => b.onclick.toString().includes(tab));
            if (btn) btn.classList.add('active');
            const titles = { 'system': '系統設定', 'rooms': '房間管理總覽', 'personnel': '人員名單管理', 'history': '登入紀錄查詢' };
            document.getElementById('tabTitle').textContent = titles[tab];

            if (tab === 'history') {
                fetchLoginHistory();
            }
        }

        // --- 名單管理邏輯 ---

        async function fetchPersonnel() {
            const roomId = document.getElementById('personnelRoomSelector').value;
            const tbody = document.getElementById('personnelTableBody');
            const loader = document.getElementById('personnelLoading');

            tbody.innerHTML = '';
            loader.style.display = 'block';

            const supabase = window.getSupabase();
            try {
                let query = supabase.from('passengers').select('*');

                // 若有選取特定房間，加入篩選條件
                if (roomId) {
                    query = query.eq('room_id', roomId);
                }

                const { data, error } = await query.order('room_id').order('name');
                if (error) throw error;

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #999; padding: 40px;">目前尚無人員名單資料</td></tr>`;
                } else {
                    data.forEach(p => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${p.name}</td>
                            <td><span class="badge badge-${p.gender}">${p.gender === 'male' ? '乾道' : '坤道'}</span></td>
                            <td><span style="font-family: monospace; font-size: 12px; color: #666;">${p.room_id}</span></td>
                            <td style="display: flex; gap: 10px;">
                                <button class="btn-action btn-save" onclick="openEditModal('${p.room_id}', '${p.name}', '${p.gender}')" style="padding: 4px 8px; font-size: 12px; display: flex; align-items: center; gap: 4px;">
                                    <i data-lucide="edit-3" style="width: 12px; height: 12px;"></i> 編輯
                                </button>
                                <button class="btn-action btn-danger" onclick="deletePersonnel('${p.room_id}', '${p.name}')" style="padding: 4px 8px; font-size: 12px; display: flex; align-items: center; gap: 4px;">
                                    <i data-lucide="trash-2" style="width: 12px; height: 12px;"></i> 刪除
                                </button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                    if (typeof lucide !== 'undefined') lucide.createIcons();

                }
            } catch (e) {
                alert("抓取人員清單失敗：" + e.message);
            } finally {
                loader.style.display = 'none';
            }
        }

        async function deletePersonnel(roomId, name) {
            if (!confirm(`確定要刪除「${name}」嗎？\n此操作無法撤回！`)) return;
            const supabase = window.getSupabase();
            try {
                // 1. 刪除名單
                const { error: pErr } = await supabase.from('passengers').delete().eq('room_id', roomId).eq('name', name);
                if (pErr) throw pErr;
                // 2. 刪除關聯座位
                await supabase.from('assignments').delete().eq('room_id', roomId).eq('name', name);
                fetchPersonnel();
            } catch (e) {
                alert("刪除失敗：" + e.message);
            }
        }

        function openEditModal(roomId, name, gender) {
            document.getElementById('editRoomId').value = roomId;
            document.getElementById('editOldName').value = name;
            document.getElementById('editPersonName').value = name;
            document.getElementById('editPersonGender').value = gender;
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        async function commitEdit() {
            const roomId = document.getElementById('editRoomId').value;
            const oldName = document.getElementById('editOldName').value;
            const newName = document.getElementById('editPersonName').value.trim();
            const gender = document.getElementById('editPersonGender').value;

            if (!newName) return alert("姓名不能為空");

            const supabase = window.getSupabase();
            try {
                if (oldName !== newName) {
                    // 若改名，涉及 PK 變動，採用先刪後加或 UPSERT (但 PK 包含 name，故須先刪)
                    const { error: delErr } = await supabase.from('passengers').delete().eq('room_id', roomId).eq('name', oldName);
                    if (delErr) throw delErr;
                    // 同步更新 Assignments
                    const { data: seat } = await supabase.from('assignments').select('*').eq('room_id', roomId).eq('name', oldName).single();
                    if (seat) {
                        await supabase.from('assignments').delete().eq('room_id', roomId).eq('name', oldName);
                        await supabase.from('assignments').insert({ room_id: roomId, name: newName, vehicle_id: seat.vehicle_id, seat_index: seat.seat_index });
                    }
                }

                const { error: insErr } = await supabase.from('passengers').upsert({ room_id: roomId, name: newName, gender: gender });
                if (insErr) throw insErr;

                alert("資料已更新！");
                closeEditModal();
                fetchPersonnel();
            } catch (e) {
                alert("更新失敗：" + e.message);
            }
        }

        // --- 登入紀錄邏輯 ---

        async function fetchLoginHistory() {
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #999; padding: 40px;">正在讀取紀錄...</td></tr>';

            const supabase = window.getSupabase();
            if (!supabase) return;

            try {
                const { data, error } = await supabase
                    .from('login_history')
                    .select('*')
                    .order('login_time', { ascending: false })
                    .limit(50);

                if (error) throw error;

                tbody.innerHTML = '';
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #999; padding: 40px;">目前尚無登入紀錄</td></tr>';
                } else {
                    data.forEach((log, index) => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${index + 1}</td>
                            <td>${log.email}</td>
                            <td>${new Date(log.login_time).toLocaleString()}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: red; padding: 40px;">讀取失敗: ${e.message}</td></tr>`;
            }
        }

        // --- 房間與系統邏輯 (保持原有) ---

        async function fetchCloudRooms() {
            const supabase = window.getSupabase();
            if (!supabase) return;
            const { data } = await supabase.from('rooms').select('*').order('created_at', { ascending: false });
            cloudRooms = data || [];
            renderCloudRooms();
            // 更新人員管理的選取選單
            const selector = document.getElementById('personnelRoomSelector');
            const currentVal = selector.value;
            selector.innerHTML = '<option value="">-- 請選擇一個房間 --</option>';
            cloudRooms.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r.id;
                opt.textContent = r.id;
                selector.appendChild(opt);
            });
            selector.value = currentVal;
        }

        function renderCloudRooms() {
            const tbody = document.getElementById('cloudRoomTableBody');
            tbody.innerHTML = '';
            cloudRooms.forEach(room => {
                const tr = document.createElement('tr');
                const isGlobal = room.id === 'SYSTEM_GLOBAL';
                tr.innerHTML = `
                    <td><b>${room.id}</b></td>
                    <td><span class="badge ${isGlobal ? 'badge-male' : 'badge-female'}">${isGlobal ? '系統' : '活動'}</span></td>
                    <td>${new Date(room.created_at).toLocaleString()}</td>
                    <td>${isGlobal ? '' : `<button class="btn-action btn-danger" onclick="deleteCloudRoom('${room.id}')" style="padding: 6px; display: flex; align-items: center; justify-content: center;"><i data-lucide="trash-2" style="width: 14px; height: 14px;"></i></button>`}</td>
                `;
                tbody.appendChild(tr);
            });
            if (typeof lucide !== 'undefined') lucide.createIcons();

        }

        async function deleteCloudRoom(id) {
            if (!confirm(`確定要刪除房間「${id}」將會永久移除該房間的所有人員名單、座位安排與自訂設定。\n\n確定要繼續嗎？`)) return;

            const supabase = window.getSupabase();
            try {
                // 1. 先清除該房間的所有關聯資料 (防止外鍵約束報錯)
                await supabase.from('passengers').delete().eq('room_id', id);
                await supabase.from('assignments').delete().eq('room_id', id);
                await supabase.from('settings').delete().eq('room_id', id);

                // 2. 刪除房間主體
                const { error } = await supabase.from('rooms').delete().eq('id', id);

                if (error) throw error;

                alert(`房間 ${id} 已成功刪除`);
                fetchCloudRooms();
            } catch (e) {
                console.error("刪除房間失敗:", e);
                alert("刪除失敗，原因可能為資料庫約束或網路問題：" + e.message);
            }
        }

        async function updateVersion() {
            await pushGlobalSetting('system_version', document.getElementById('versionInput').value.trim());
            alert('同步成功');
        }

        async function updateManual() {
            await pushGlobalSetting('user_manual', document.getElementById('manualInput').value);
            alert('同步成功');
        }

        async function updateUpdates() {
            await pushGlobalSetting('recent_updates', document.getElementById('updatesInput').value);
            alert('近期更新已同步成功');
        }

        async function pushGlobalSetting(key, value) {
            const supabase = window.getSupabase();
            if (!supabase) return;
            try {
                const { error } = await supabase
                    .from('settings')
                    .upsert({ room_id: GLOBAL_ROOM, key: key, value: value }, { onConflict: 'room_id,key' });
                if (error) throw error;
            } catch (e) {
                console.error("同步失敗:", e);
                alert("同步至雲端失敗");
            }
        }

        window.onload = initAdmin;
    </script>
</body>

</html>
