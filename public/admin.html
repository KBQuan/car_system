<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者登入 - 法樞控制台</title>
    <link rel="icon" type="image/png" href="admin_favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div class="login-container">
        <h2 style="display: flex; align-items: center; justify-content: center; gap: 10px;">
            <i data-lucide="shield-check" style="width: 28px; height: 28px;"></i> 法樞控制台
        </h2>
        <div class="subtitle">—— 管理者身分驗證 ——</div>

        <form id="loginForm">
            <div class="form-group">
                <label>管理道號 (Email):</label>
                <input type="text" id="email" required placeholder="請輸入管理者信箱">
            </div>

            <div class="form-group">
                <label>禁制靈根 (密碼):</label>
                <input type="password" id="password" required placeholder="請輸入密碼">
            </div>

            <div class="form-group">
                <label>天機驗證 (點擊右側可更換):</label>
                <div class="captcha-row">
                    <div class="captcha-input-wrap">
                        <input type="text" id="captcha" required placeholder="請輸入天機">
                    </div>
                    <div class="captcha-img-wrap" id="captchaDisplay" onclick="refreshCaptcha()" title="點擊更換天機">
                        <!-- 隨機數字 -->
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                <i data-lucide="power" style="width: 18px; height: 18px;"></i> 啟動控制台
            </button>
            <div id="errorMsg" class="error-msg" style="display: none; align-items: center; justify-content: center; gap: 8px;">
                <i data-lucide="x-circle" style="width: 16px; height: 16px;"></i> 道號或靈根錯誤，請重新參悟。
            </div>

        </form>

        <div class="back-link">
            <a href="index.html" style="display: inline-flex; align-items: center; gap: 6px;">
                <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i> 返回名單視窗
            </a>
        </div>

    </div>


    <script>
        let currentCaptcha = "";

        /**
         * 隨機產生 4 位數天機驗證碼
         */
        function refreshCaptcha() {
            const digits = '0123456789';
            let code = '';
            for (let i = 0; i < 4; i++) {
                code += digits[Math.floor(Math.random() * 10)];
            }
            currentCaptcha = code;

            // 隨機空格讓它看起來像真的驗證碼
            document.getElementById('captchaDisplay').innerText = code.split('').join(' ');
        }

        // 初始化時產生一組
        window.addEventListener('DOMContentLoaded', () => {
            refreshCaptcha();
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });


        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const emailInput = document.getElementById('email').value.trim();
            const passInput = document.getElementById('password').value.trim();
            const captchaInput = document.getElementById('captcha').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';

            // 1. 驗證天機
            if (captchaInput !== currentCaptcha) {
                alert("天機驗證失敗，請重新觀察天機！");
                refreshCaptcha(); // 失敗後隨機更換
                document.getElementById('captcha').value = "";
                return;
            }

            // 2. 顯示登入中狀態
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i data-lucide="loader-2" style="width: 18px; height: 18px;" class="animate-spin"></i> 正在解開禁制...';
            if (typeof lucide !== 'undefined') lucide.createIcons();


            const supabase = window.getSupabase();
            if (!supabase) {
                alert("系統錯誤：無法連結至資料庫");
                submitBtn.disabled = false;
                return;
            }

            // 3. 查詢雲端帳號資料庫 (隱藏式的驗證)
            const { data: user, error } = await supabase
                .from('admin_users')
                .select('*')
                .eq('email', emailInput)
                .eq('password', passInput)
                .single();

            setTimeout(async () => {
                if (user && !error) {
                    // 紀錄登入紀錄 (使用 await 確保寫入完成再跳轉)
                    await recordLogin(user.email);

                    // 儲存目前登入者資訊以供顯示
                    localStorage.setItem('adminEmail', user.email);

                    alert("驗證成功！即將進入法樞控制台。");
                    // 登入成功後跳轉至管理者控制中心
                    window.location.href = "admin_index.html";
                } else {
                    errorMsg.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i data-lucide="power" style="width: 18px; height: 18px;"></i> 啟動控制台';
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                    refreshCaptcha(); // 失敗後隨機更換

                    // 震動效果提醒
                    const container = document.querySelector('.login-container');
                    container.animate([
                        { transform: 'translateX(-5px)' },
                        { transform: 'translateX(5px)' },
                        { transform: 'translateX(0)' }
                    ], { duration: 100, iterations: 3 });
                }
            }, 800);
        });

        async function recordLogin(email) {
            const supabase = window.getSupabase();
            if (!supabase) return;
            try {
                // 使用 select() 確保請求發送成功
                await supabase.from('login_history').insert({ email: email }).select();
                console.log("登入紀錄已寫入");
            } catch (e) {
                console.error("無法紀錄登入時間:", e);
            }
        }
    </script>
</body>

</html>
