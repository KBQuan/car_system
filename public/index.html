<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>車輛安排系統</title>
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/db.js"></script>
    <script src="js/supabase.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/sync-manager.js"></script>
    <link rel="stylesheet" href="css/index.css">
</head>


<body ondragover="event.preventDefault()" ondrop="dropToVoid(event)">

    <!-- 側邊欄切換按鈕 -->
    <button class="sidebar-toggle-btn" onclick="toggleSidebar()">
        ☰
    </button>

    <!-- 側邊欄 -->

    <div id="sidebar">
        <div class="sidebar-brand">
            <i data-lucide="layout-grid" style="color: #2563eb;"></i>
            <h2>功能面板</h2>
        </div>

        <div class="sidebar-scroll-area">
            <div class="nav-item" onclick="openManual()">
                <i data-lucide="book-open"></i>
                <span class="label">使用說明書</span>
            </div>

            <div class="nav-item " onclick="openUpdates()">
                <i data-lucide="sparkles"></i>
                <span class="label">近期更新</span>
            </div>

            <div class="nav-item" onclick="openSettings()">
                <i data-lucide="settings"></i>
                <span class="label">介面設定</span>
            </div>

            <div class="sidebar-divider"></div>

            <h3 class="sidebar-section-header collapsed" onclick="toggleSection(this)">
                <span style="display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="users" style="width: 16px; height: 16px;"></i> 多人即時協作
                </span>
                <i data-lucide="chevron-down" class="chevron"></i>
            </h3>
            <div class="sidebar-section-content hidden">
                <div>
                    <div class="glass-panel"
                        style="padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
                        <small style="color: #666;">輸入房間 ID 以加入共編。</small>

                        <!-- 房間預設選單容器 -->
                        <div id="roomPresetContainer" style="display: none; margin-bottom: 10px;"></div>

                        <input type="text" id="roomIdInput" placeholder="輸入房間名稱"
                            style="width: 100%; box-sizing: border-box;">
                        <button class="glass-btn primary" onclick="joinRoom()"
                            style="width: 100%; margin: 0; padding: 10px; border-radius: 6px;">
                            <i data-lucide="link"
                                style="width: 16px; height: 16px; vertical-align: middle; margin-right: 5px;"></i>
                            加入房間
                        </button>
                        <div id="roomStatus"
                            style="font-size: 12px; color: #7b1fa2; font-weight: bold; text-align: center; display: none;">
                            同步中：<span id="activeRoomId"></span>
                            <button class="glass-btn danger" onclick="leaveRoom()"
                                style="border: none; padding: 2px 8px; border-radius: 4px; cursor: pointer; margin-left: 10px; font-size: 11px;">退出</button>
                        </div>
                    </div>
                </div>
            </div>

            <h3 class="sidebar-section-header collapsed" onclick="toggleSection(this)">
                <span style="display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="archive" style="width: 16px; height: 16px;"></i> 進度儲存
                </span>
                <i data-lucide="chevron-down" class="chevron"></i>
            </h3>
            <div class="sidebar-section-content hidden">
                <div>
                    <div class="glass-panel"
                        style="padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px;">
                        <button class="glass-btn info" onclick="exportJSONBackup()"
                            style="border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; margin: 0; font-size: 14px; font-weight: bold;">
                            <i data-lucide="download"
                                style="width: 16px; height: 16px; vertical-align: middle; margin-right: 5px;"></i>
                            匯出進度檔
                        </button>
                        <label class="glass-btn warning"
                            style="cursor: pointer; display: block; border-radius: 6px; padding: 10px; text-align: center; font-size: 14px; font-weight: bold;">
                            <i data-lucide="upload"
                                style="width: 16px; height: 16px; vertical-align: middle; margin-right: 5px;"></i>
                            匯入進度檔
                            <input type="file" accept=".json" onchange="importJSONBackup(event)" style="display: none;">
                        </label>
                    </div>
                </div>
            </div>

            <h3 class="sidebar-section-header collapsed" onclick="toggleSection(this)">
                <span style="display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="file-spreadsheet" style="width: 16px; height: 16px;"></i> 資料交換
                </span>
                <i data-lucide="chevron-down" class="chevron"></i>
            </h3>
            <div class="sidebar-section-content hidden">
                <div>
                    <div class="glass-panel"
                        style="padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px;">
                        <label class="glass-btn success"
                            style="cursor: pointer; display: block; border-radius: 6px; font-weight: bold; padding: 10px; line-height: normal; margin: 0; text-align: center; font-size: 14px;">
                            <i data-lucide="file-up"
                                style="width: 16px; height: 16px; vertical-align: middle; margin-right: 5px;"></i>
                            匯入 Excel 名單
                            <input type="file" id="excelFile" accept=".xlsx,.xls" onchange="importExcel(event)"
                                style="display: none;">
                        </label>
                        <button class="glass-btn secondary export-excel-btn" onclick="exportExcel()"
                            style="width: 100%; margin: 0; padding: 10px; font-size: 14px; font-weight: bold; border-radius: 6px;">
                            <i data-lucide="file-down"
                                style="width: 16px; height: 16px; vertical-align: middle; margin-right: 5px;"></i>
                            匯出 Excel
                        </button>
                        <button class="glass-btn secondary export-btn" onclick="exportPNG()"
                            style="width: 100%; margin: 0; padding: 10px; font-size: 14px; font-weight: bold; border-radius: 6px;">
                            <i data-lucide="image"
                                style="width: 16px; height: 16px; vertical-align: middle; margin-right: 5px;"></i>
                            匯出 PNG 圖片
                        </button>
                    </div>
                </div>
            </div>

            <h3 class="sidebar-section-header collapsed" onclick="toggleSection(this)">
                <span style="display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="file-lock" style="width: 16px; height: 16px;"></i> 安全管理
                </span>
                <i data-lucide="chevron-down" class="chevron"></i>
            </h3>

            <div class="sidebar-section-content hidden">
                <div>
                    <div class="glass-panel"
                        style="padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
                        <a href="admin.html" id="adminLoginLink" class="glass-btn dark"
                            style="border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; margin: 0; font-size: 14px; font-weight: bold; text-decoration: none; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px;">
                            <i data-lucide="key-round" style="width: 16px; height: 16px;"></i> 管理者登入
                        </a>
                        <button onclick="logoutAdmin()" id="adminLogoutBtn" class="glass-btn danger"
                            style="display: none; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; margin: 0; font-size: 14px; font-weight: bold; align-items: center; justify-content: center; gap: 8px;">
                            <i data-lucide="log-out" style="width: 16px; height: 16px;"></i> 登出管理模式
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- 主要內容區 -->
    <div id="content-wrapper">
        <div class="controls glow-border">
            <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 5px;">
                <h2 style="display: flex; align-items: center; gap: 10px;">
                    <i data-lucide="car" style="width: 24px; height: 24px;"></i> 車輛安排系統
                </h2>

            </div>

            <div class="control-row">
                <div class="input-container-group">
                    <input type="text" id="nameInput" placeholder="輸入人員姓名...">
                    <div class="add-btn-group">
                        <button class="btn-add male" onclick="addPerson('male')">
                            <i data-lucide="user-plus" style="width: 16px; height: 16px;"></i> 乾道
                        </button>
                        <button class="btn-add female" onclick="addPerson('female')">
                            <i data-lucide="user-plus" style="width: 16px; height: 16px;"></i> 坤道
                        </button>
                    </div>
                </div>
            </div>

            <div class="vehicle-count-row">
                <label>設定車輛數:</label>
                <select id="vehicleCount" onchange="saveVehicleCount()">
                    <option value="4">4 台</option>
                    <option value="6">6 台</option>
                    <option value="8">8 台</option>
                    <option value="10">10 台</option>
                    <option value="12">12 台</option>
                    <option value="20">20 台</option>
                </select>
            </div>



            <div class="action-buttons">
                <button class="btn-delete-selected" onclick="deleteSelected()"
                    style="display: flex; align-items: center; gap: 6px;">
                    <i data-lucide="trash-2" style="width: 16px; height: 16px;"></i> 刪除選取人員
                </button>
                <button class="btn-clear-all" onclick="clearAllPersons()"
                    style="display: flex; align-items: center; gap: 6px;">
                    <i data-lucide="trash-2" style="width: 16px; height: 16px;"></i> 清除所有人員
                </button>
                <small style="display: block; width: 100%; margin-top: 5px; color: #666;">點擊人員姓名可選取/取消選取</small>
            </div>

        </div>

        <div class="lists">
            <div class="list glow-border" id="maleList" ondrop="dropToList(event, 'male')"
                ondragover="allowDrop(event)">
                <h4>乾道名單</h4>
            </div>
            <div class="list glow-border" id="femaleList" ondrop="dropToList(event, 'female')"
                ondragover="allowDrop(event)">
                <h4>坤道名單</h4>
            </div>
        </div>

        <div class="container" id="vehicle-container"></div>

    </div> <!-- 結束 content-wrapper -->

    <!-- 使用者功能設定 Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content" style="max-width: 450px;">
            <span class="close-modal" onclick="closeSettings()">&times;</span>
            <h2 style="margin-top: 0; text-align: left; display: flex; align-items: center; gap: 10px;">
                <i data-lucide="settings" style="width: 24px; height: 24px;"></i> 使用者功能設定
            </h2>


            <div class="manual-body">
                <!-- 總開關 -->
                <div class="settings-group" style="display: flex; justify-content: space-between; align-items: center;">
                    <div class="settings-label" style="margin-bottom: 0; display: flex; align-items: center; gap: 8px;">
                        <i data-lucide="sparkles" style="width: 18px; height: 18px;"></i>
                        <span>啟用邊框發光效果</span>
                    </div>

                    <label class="switch">
                        <input type="checkbox" id="glowEnabledToggle" onchange="toggleGlow(this.checked)" checked>
                        <span class="slider-round"></span>
                    </label>
                </div>

                <!-- 詳細設定區 -->
                <div id="glowSettingsDetail" class="settings-group">
                    <div class="settings-item">
                        <div class="settings-label" style="display: flex; align-items: center; gap: 8px;">
                            <i data-lucide="palette" style="width: 18px; height: 18px;"></i> 追蹤光顏色
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 10px;">
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <input type="color" id="glowColorPicker" onchange="changeGlowColor(this.value)"
                                    style="width: 44px; height: 32px; border: none; padding: 0; background: none; cursor: pointer;">
                                <span id="colorValueDisplay"
                                    style="font-family: monospace; font-size: 14px; background: #f1f5f9; padding: 4px 8px; border-radius: 4px; color: #475569;">#808080</span>
                            </div>
                            <!-- 預設顏色 -->
                            <div class="preset-buttons">
                                <button class="preset-btn" style="background: #808080;"
                                    onclick="changeGlowColor('#808080')" title="經典灰"></button>
                                <button class="preset-btn" style="background: #2196f3;"
                                    onclick="changeGlowColor('#2196f3')" title="冰雪藍"></button>
                                <button class="preset-btn" style="background: #4caf50;"
                                    onclick="changeGlowColor('#4caf50')" title="草地綠"></button>
                                <button class="preset-btn" style="background: #ffc107;"
                                    onclick="changeGlowColor('#ffc107')" title="琥珀金"></button>
                                <button class="preset-btn" style="background: #f06292;"
                                    onclick="changeGlowColor('#f06292')" title="櫻花粉"></button>
                                <button class="preset-btn" style="background: #9c27b0;"
                                    onclick="changeGlowColor('#9c27b0')" title="神秘紫"></button>
                            </div>
                        </div>
                    </div>

                    <div class="settings-item">
                        <div class="settings-label" style="display: flex; align-items: center; gap: 8px;">
                            <i data-lucide="lightbulb" style="width: 18px; height: 18px;"></i> 發光亮度
                        </div>

                        <input type="range" id="glowOpacitySlider" min="0.1" max="1" step="0.05" value="0.7"
                            oninput="updateGlowOpacity(this.value)" style="width: 100%;">
                        <div style="display: flex; justify-content: space-between; margin-top: 5px;">
                            <span id="opacityValueDisplay"
                                style="font-size: 12px; color: #2196f3; font-weight: bold;">70%</span>
                        </div>
                    </div>

                    <div class="settings-item">
                        <div class="settings-label" style="display: flex; align-items: center; gap: 8px;">
                            <i data-lucide="ruler" style="width: 18px; height: 18px;"></i> 擴散範圍
                        </div>

                        <input type="range" id="glowSizeSlider" min="50" max="600" step="10" value="150"
                            oninput="updateGlowSize(this.value)" style="width: 100%;">
                        <div style="display: flex; justify-content: space-between; margin-top: 5px;">

                            <button onclick="resetSettings()"
                                style="background: #9e9e9e; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-size: 13px; width: fit-content; align-self: flex-end;">恢復預設</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 近期更新 Modal -->
    <div id="updatesModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeUpdates()">&times;</span>
            <h2 style="margin-top: 0; text-align: left; display: flex; align-items: center; gap: 10px;">
                <i data-lucide="sparkles" style="width: 24px; height: 24px; color: #7c3aed;"></i> 近期更新
            </h2>
            <div class="manual-body" id="updatesBody"></div>
        </div>
    </div>

    <!-- 使用說明書 Modal -->

    <div id="manualModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeManual()">&times;</span>
            <h2 style="margin-top: 0; text-align: left; display: flex; align-items: center; gap: 10px;">
                <i data-lucide="book-open" style="width: 24px; height: 24px;"></i> 使用說明書
            </h2>

            <div class="manual-body">
                <!-- 由 main.js 動態注入內容 -->
                <div style="text-align: center; color: #999; padding: 20px;">載入說明書中...</div>
            </div>
        </div>
    </div>

    <!-- 主要內容區之後的腳本 -->
    <script src="js/main.js"></script>
    <script>
        // 初始化 Lucide 圖示
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }

        async function openUpdates() {
            closeSettings();
            closeManual();
            const modal = document.getElementById('updatesModal');
            modal.style.display = 'block';
            setTimeout(() => modal.classList.add('active'), 10);

            const updatesBody = document.getElementById('updatesBody');
            if (!updatesBody) return;

            // 顯示載入中
            updatesBody.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:30px;"><div style="font-size:28px; margin-bottom:8px;">⏳</div><p style="margin:0; font-size:14px;">讀取更新記錄中...</p></div>';

            try {
                let content = null;

                // 優先從 Supabase 取得最新內容
                const supabase = window.getSupabase && window.getSupabase();
                if (supabase) {
                    const { data } = await supabase
                        .from('settings')
                        .select('value')
                        .eq('room_id', 'SYSTEM_GLOBAL')
                        .eq('key', 'recent_updates')
                        .single();
                    if (data && data.value) content = data.value;
                }

                // 若 Supabase 無資料，從本地 IndexedDB 讀取快取
                if (!content && window.appDB) {
                    const local = await window.appDB.getSetting('recent_updates');
                    if (local && local.value) content = local.value;
                }

                if (content) {
                    updatesBody.innerHTML = content;
                } else {
                    updatesBody.innerHTML = `
<div style="text-align:center; padding:30px 20px; color:#94a3b8;">
    <div style="font-size:40px; margin-bottom:12px;">📋</div>
    <p style="font-weight:600; color:#64748b; margin-bottom:6px;">尚未發布近期更新</p>
    <p style="font-size:13px; margin:0;">管理員可至<strong>管理後台 → 系統設定 → 近期更新編輯</strong>撰寫並同步內容。</p>
</div>`;
                }
            } catch (err) {
                console.error('[Updates] 讀取失敗:', err);
                updatesBody.innerHTML = '<div style="text-align:center; color:#ef4444; padding:20px;">讀取失敗，請檢查網路連線。</div>';
            }
        }

        function closeUpdates() {
            const modal = document.getElementById('updatesModal');
            modal.style.display = 'none';
            modal.classList.remove('active');
        }

        function openManual() {

            closeSettings();
            const modal = document.getElementById('manualModal');
            modal.style.display = "block";
            // 觸發內容浮出動畫
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function closeManual() {
            const modal = document.getElementById('manualModal');
            modal.style.display = "none";
            modal.classList.remove('active');
        }

        window.addEventListener('click', function (event) {
            let modal = document.getElementById('manualModal');
            let settingsModal = document.getElementById('settingsModal');
            let updatesModal = document.getElementById('updatesModal');
            if (event.target === modal) closeManual();
            if (event.target === settingsModal) closeSettings();
            if (event.target === updatesModal) closeUpdates();
        });

        function toggleSection(header) {
            const content = header.nextElementSibling;
            const isHidden = content.classList.toggle('hidden');
            header.classList.toggle('collapsed', isHidden);
        }

        function openSettings() {
            closeManual();
            const modal = document.getElementById('settingsModal');
            modal.style.display = "block";
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function closeSettings() {
            const modal = document.getElementById('settingsModal');
            modal.style.display = "none";
            modal.classList.remove('active');
        }
    </script>

    <div class="version-info" style="display: flex; align-items: center; justify-content: center; gap: 4px;">
        載入版本中 <i data-lucide="copyright" style="width: 12px; height: 12px;"></i>
    </div>

</body>

</html>
